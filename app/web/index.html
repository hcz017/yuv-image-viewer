<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YUV Image Viewer</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="shell">
      <header id="menubar" class="menubar"></header>
      <div id="banner" class="banner hidden"></div>
      <div class="layout">
        <aside id="sidebar" class="sidebar">
          <div class="sidebar-title">目录</div>
          <div id="tree" class="tree"></div>
        </aside>
        <div id="splitter" class="splitter" title="拖动调整侧栏宽度"></div>
        <main class="main">
          <div class="toolbar">
            <button id="back" class="nav-button" title="返回列表 (Esc)" aria-label="返回列表">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M13 8H3M7 4L3 8l4 4" />
              </svg>
            </button>
            <button id="prev" class="nav-button hidden" title="上一张 (←)" aria-label="上一张">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10 3L5 8l5 5" />
              </svg>
            </button>
            <button id="next" class="nav-button hidden" title="下一张 (→)" aria-label="下一张">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 3l5 5-5 5" />
              </svg>
            </button>
            <input id="address" class="address" spellcheck="false" placeholder="输入绝对路径后回车" />
            <button id="go" class="icon-button" title="前往">前往</button>
            <label id="format-control" class="format-control hidden">
              <span>格式</span>
              <select id="format"></select>
            </label>
            <label id="color-control" class="format-control hidden">
              <span>色彩标准</span>
              <select id="color-standard"></select>
            </label>
            <div id="spec-control" class="spec-control hidden">
              <label class="spec-field">
                <span>宽</span>
                <input id="spec-width" class="spec-input" type="number" min="2" step="2" />
              </label>
              <label class="spec-field">
                <span>高</span>
                <input id="spec-height" class="spec-input" type="number" min="2" step="2" />
              </label>
              <label class="spec-field">
                <span>stride</span>
                <input id="spec-stride" class="spec-input" type="number" min="1" step="1" />
              </label>
              <label class="spec-field">
                <span>scanline</span>
                <input id="spec-scanline" class="spec-input" type="number" min="1" step="1" />
              </label>
            </div>
            <div id="zoom-control" class="zoom-control hidden">
              <button id="zoom-one" title="按实际大小显示 (1)">1:1</button>
              <button id="zoom-fit" title="按适合窗口显示 (F)">适合窗口</button>
            </div>
            <div id="compare-control" class="compare-control hidden">
              <label>
                <input id="compare-sync" type="checkbox" checked />
                同步视图
              </label>
              <button id="compare-swap">交换 A/B</button>
            </div>
            <div class="toolbar-spacer"></div>
          </div>
          <div id="stage" class="stage hidden"></div>
          <div id="list" class="list-host"></div>
          <div class="statusbar">
            <span id="file-caption" class="caption"></span>
            <span id="readout" class="readout"></span>
            <span id="error" class="error"></span>
            <span id="notice" class="notice hidden"></span>
            <span id="scale" class="scale"></span>
          </div>
        </main>
      </div>
    </div>
    <script src="boot.js"></script>
  </body>
</html>
